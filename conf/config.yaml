# Top-level cardiac_ml config. Defaults compose one file per group.
# Override any group from CLI: python scripts/train.py model=ionic_node data=t1_multi_bcl
defaults:
  - model: ionic_node
  - data: t1_multi_bcl
  - training: teacher_forced
  - optimizer: adam
  - tracking: default
  - experiment: null       # loose: set via +experiment=<name> on CLI
  - _self_
