# @package _global_
# Synthetic smoke test — trivial MLP + linear dataset, 5 epochs. Used by
# cardiac_ml/tests/test_end_to_end.py to verify the full harness runs.
defaults:
  - override /model: synthetic_mlp
  - override /data: synthetic_linear
  - override /training: teacher_forced
  - override /tracking: default

training:
  epochs: 5
  device: cpu
  optimizer:
    lr: 0.1
