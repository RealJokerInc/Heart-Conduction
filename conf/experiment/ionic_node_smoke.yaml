# @package _global_
# 2-epoch NODE smoke — 1 train BCL + 1 val BCL. Verifies the full stack.
# Wall time: ~2-4 min on Blackwell (R4 reality check §7).
defaults:
  - override /model: ionic_node
  - override /data: t1_multi_bcl
  - override /training: node
  - override /tracking: default

training:
  epochs: 2

data:
  train:
    bcls: [500]
    n_beats: 20
    min_beat: 15            # 5 beats total — matches oracle ratio
  val:
    bcls: [600]
    n_beats: 20
    min_beat: 17            # 3 beats
