# Default training group: teacher-forced MSE (matches PLAN §7.1).
# Used by the diffusion-ResNet stub in Step 5.3 and any future teacher-forced model.
epochs: 10
seed: 42
device: cuda
dtype: float64
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
train_step_fn:
  _target_: hydra.utils.get_method
  path: cardiac_ml.training.default_steps.teacher_forced_step
val_step_fn:
  _target_: hydra.utils.get_method
  path: cardiac_ml.training.default_steps.teacher_forced_val_step
callbacks: []
