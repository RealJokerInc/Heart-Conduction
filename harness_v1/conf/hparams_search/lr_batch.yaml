# @package _global_
# Loose group — activate via: python scripts/sweep.py --multirun +hparams_search=lr_batch
#
# Note: hydra-optuna-sweeper 1.2.0 (our pinned version) does NOT expose a
# `pruner` field on OptunaSweeperConf — only `sampler`. The original plan's
# `MedianPruner` block broke composition. Pruning is deferred: at n_trials=3
# it adds no value, and upgrading the sweeper plugin triggers the forced
# downgrade of optuna<3.0 (pinned by the 1.2.0 plugin). If pruning becomes
# critical, reconfigure via a `study_callback` instead.
defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
    direction: minimize
    study_name: lr_sweep
    n_trials: 3
    n_jobs: 1
    params:
      training.optimizer.lr: choice(1e-3, 5e-4, 1e-4)
